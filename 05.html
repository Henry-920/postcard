<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071b36">
  <meta name="description" content="珍惜当下 · Cherish the Present — a bilingual digital postcard.">
  <title>珍惜当下 · Cherish the Present</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="page">
    <article class="postcard" aria-label="珍惜当下 · Cherish the Present">
      <img class="artwork" src="images/cherish.jpg" alt="邮轮主题竖版插画">
      <section class="message">
        <h1>珍惜当下</h1>
        <h2>Cherish the Present</h2>
        <div class="ornament" aria-hidden="true"></div>
        <p class="cn">愿你们永远保有对生活的热爱，不辜负眼前的风景，也不辜负身边最珍贵的人。愿未来的每一天，都值得回忆。</p>
        <div class="ornament" aria-hidden="true"></div>
        <p class="en">May you never lose your love for life. Cherish the beauty around you, treasure the people beside you, and make every day a memory worth keeping.</p>
      </section>
    </article>
  </main>
