<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071b36">
  <meta name="description" content="陪伴 · Togetherness — a bilingual digital postcard.">
  <title>陪伴 · Togetherness</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="page">
    <article class="postcard" aria-label="陪伴 · Togetherness">
      <img class="artwork" src="images/togetherness.jpg" alt="邮轮主题竖版插画">
      <section class="message">
        <h1>陪伴</h1>
        <h2>Togetherness</h2>
        <div class="ornament" aria-hidden="true"></div>
        <p class="cn">愿未来的每一段旅程，都有人与你并肩。无论走过多少风景，经历多少岁月，愿彼此始终是生命中最温暖的陪伴。</p>
        <div class="ornament" aria-hidden="true"></div>
        <p class="en">May every journey bring you someone to walk beside. No matter how far life takes you, may you always find warmth and comfort in each other.</p>
      </section>
    </article>
  </main>
